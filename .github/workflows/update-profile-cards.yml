# Gera os cards de estatísticas do perfil localmente (via GitHub Actions) e
# faz commit dos SVGs em profile/. Isso substitui a instância pública
# github-readme-stats.vercel.app, que está fora do ar (HTTP 503).
#
# Opcional: para contabilizar commits/repos privados, crie um Personal Access
# Token (classic) com os escopos `repo` e `read:user` e salve-o como secret do
# repositório com o nome STATS_TOKEN. Sem ele, o GITHUB_TOKEN padrão é usado
# (apenas dados públicos).
name: Atualizar cards do perfil

on:
  schedule:
    - cron: "0 3 * * *" # Diariamente às 00:00 (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar pasta de saída
        run: mkdir -p profile

      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&locale=pt-br&include_all_commits=true&count_private=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Card de linguagens mais usadas
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&locale=pt-br&hide=dockerfile
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gráfico de contribuições (snake)
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit dos cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && { echo "Nenhuma alteração nos cards."; exit 0; }
          git commit -m "chore: atualiza cards do perfil"
          git push
